name: release

# Fires when a v* tag is pushed. scripts/release.sh creates that tag locally;
# this turns it into a GitHub Release whose body is the CHANGELOG section for
# that version, so the release notes and the changelog can never disagree —
# they are the same text.
#
# The order of the steps below is the order they must fail in. Publishing a
# release that installs broken scripts is worse than publishing nothing, and
# a GitHub Release cannot be quietly un-published — the tag is already out
# there and 'curl | bash' is already pointing at it.

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false     # never cancel a half-published release

jobs:
  release:
    name: publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: the tag must match VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "  tag     $tag"
          echo "  VERSION $file"
          if [ "$tag" != "$file" ]; then
            echo "  x tag v$tag was pushed at a commit whose VERSION says $file."
            echo "    Tag the release commit, not an earlier one."
            exit 1
          fi

      - name: the tag must be on main
        # A tag pushed from a feature branch would publish code that never
        # merged, and 'curl | bash' installs from main — so the release notes
        # would describe something nobody can install.
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "  v${GITHUB_REF_NAME#v} is on main"
          else
            echo "  x $GITHUB_SHA is not an ancestor of origin/main."
            echo "    Merge the release commit before tagging it."
            exit 1
          fi

      - name: everything CI checks, again, at the tagged commit
        # CI ran on the branch. This runs the same checks on the exact tree
        # the release will ship, which is not always the same thing — a bad
        # merge, an amended commit, or a tag on the wrong SHA all diverge
        # here and nowhere else.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          git ls-files '*.sh' \
            | xargs -r shellcheck -S warning \
                -e SC2086,SC2181,SC1090,SC1091,SC2034,SC2207,SC2046
          ./scripts/release.sh --check
          ./scripts/audit-graders.sh
          ./scripts/check-tasks.sh

      - name: a fresh install of the tagged tree works
        # The last thing to verify before publishing is the one thing every
        # reader of the release notes will do first.
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          sed 's|https://raw.githubusercontent.com/${GH_USER}/cka-practice/${BRANCH}|http://127.0.0.1:8123|' \
            bootstrap.sh > /tmp/bootstrap-local.sh
          HOME=/tmp/fakehome EXAM=none bash /tmp/bootstrap-local.sh
          n=$(find /tmp/fakehome/cka-practice/exams -name 'exam*.sh' | wc -l)
          [ "$n" = "$(grep -cE '^[0-9]+\|[a-z-]+\|exam' cka.sh)" ]
          HOME=/tmp/fakehome /tmp/fakehome/cka-practice/cka.sh help >/dev/null
          echo "  installs $n exams and runs"

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ./scripts/changelog-section.sh "$ver" > /tmp/notes.md
          # A release with empty notes is worse than no release: the CHANGELOG
          # link points at it and says nothing.
          [ -s /tmp/notes.md ] || { echo "  x no CHANGELOG content for $ver"; exit 1; }
          {
            echo
            echo "---"
            echo
            echo "Install or upgrade:"
            echo
            echo '```bash'
            echo "curl -sL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/bootstrap.sh | bash"
            echo "source ~/cka-practice/activate.sh"
            echo '```'
          } >> /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag
